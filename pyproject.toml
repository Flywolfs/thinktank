[project]
name = "think-tank"
version = "0.1.0"
description = "智库情报系统 — 实体情报 / 社会情报 / 金融情报"
requires-python = ">=3.12"
dependencies = [
    "wikipedia",
    "httpx",
    "python-dotenv",
    "pydantic",
    "neo4j>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "entity_intel", "social_intel", "financial_intel"]
